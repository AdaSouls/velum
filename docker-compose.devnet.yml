# Midnight devnet for local AdaSouls development.
# Usage:
#   docker compose -f docker-compose.devnet.yml pull   # first time
#   docker compose -f docker-compose.devnet.yml up -d
#   docker compose -f docker-compose.devnet.yml down
#   docker compose -f docker-compose.devnet.yml down -v  # wipe data

services:
  node:
    image: "midnightnetwork/midnight-node:0.3.2-e85e6a2"
    platform: linux/amd64
    container_name: "poap-midnight-node"
    ports:
      - "9944:9944"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9944/health"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 40s
    environment:
      RUN_DEV_NET: "TRUE"

  proof-server:
    image: "midnightnetwork/proof-server:2.0.7"
    container_name: "poap-proof-server"
    ports:
      - "6300:6300"
    environment:
      RUST_BACKTRACE: "full"
    command: ["midnight-proof-server", "--network", "devnet"]

  postgres:
    image: postgres:15
    container_name: "poap-postgres"
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: "indexer"
      POSTGRES_PASSWORD: "indexer"
      POSTGRES_DB: "indexer"
    volumes:
      - poap_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U indexer"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7.2.4
    container_name: "poap-redis"
    ports:
      - "6379:6379"

  chain-indexer:
    image: "midnightnetwork/midnight-pubsub-indexer:1.2.0"
    platform: linux/amd64
    container_name: "poap-chain-indexer"
    environment:
      OPERATION_MODE: "chain-indexer"
      LOG_LEVEL: "INFO"
      LEDGER_NETWORK_ID: "Undeployed"
      SUBSTRATE_NODE_WS_URL: "ws://node:9944"
      DB_VENDOR: "postgresql"
      DB_URL: "postgres:5432/indexer"
      DB_USER: "indexer"
      DB_PASS: "indexer"
      REDIS_URL: "tcp://redis:6379"
      OTEL_JAVAAGENT_ENABLED: "false"
    healthcheck:
      test: ["CMD", "sh", "-c", "grep -q 'Successfully applied .* migrations to schema' /tmp/app_logs/server.log"]
      interval: 5s
      timeout: 5s
      retries: 30
    depends_on:
      node:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  wallet-indexer:
    image: "midnightnetwork/midnight-pubsub-indexer:1.2.0"
    platform: linux/amd64
    container_name: "poap-wallet-indexer"
    ports:
      - "8089:8088"
    environment:
      OPERATION_MODE: "wallet-indexer"
      LOG_LEVEL: "INFO"
      LEDGER_NETWORK_ID: "Undeployed"
      SUBSTRATE_NODE_WS_URL: "ws://node:9944"
      DB_VENDOR: "postgresql"
      DB_URL: "postgres:5432/indexer"
      DB_USER: "indexer"
      DB_PASS: "indexer"
      REDIS_URL: "tcp://redis:6379"
      OTEL_JAVAAGENT_ENABLED: "false"
    depends_on:
      chain-indexer:
        condition: service_healthy

  graphql-api:
    image: "midnightnetwork/midnight-pubsub-indexer:1.2.0"
    platform: linux/amd64
    container_name: "poap-graphql-api"
    ports:
      - "8090:8088"
    environment:
      OPERATION_MODE: "pubsub"
      LOG_LEVEL: "INFO"
      LEDGER_NETWORK_ID: "Undeployed"
      SUBSTRATE_NODE_WS_URL: "ws://node:9944"
      DB_VENDOR: "postgresql"
      DB_URL: "postgres:5432/indexer"
      DB_USER: "indexer"
      DB_PASS: "indexer"
      REDIS_URL: "tcp://redis:6379"
      OTEL_JAVAAGENT_ENABLED: "false"
    depends_on:
      chain-indexer:
        condition: service_healthy

volumes:
  poap_pg_data:
