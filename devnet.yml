# Midnight Local Development Network
# Generated: 2026-08-05T02:55:31Z (poap-pg merged in + indexer-standalone bumped 2026-08-13)
# Generator: midnight-tooling plugin
#
# Single devnet compose file for this project — the old docker-compose.devnet.yml
# (pre-migration node/proof-server/indexer generation) has been removed; poap-pg
# (the indexer app's own business-data Postgres, unrelated to the Midnight SDK
# generation) now lives here instead.
#
# Usage:
#   docker compose -f devnet.yml pull   # first time
#   docker compose -f devnet.yml up -d
#   docker compose -f devnet.yml down
#   docker compose -f devnet.yml down -v  # wipe data

name: midnight-devnet

services:
  node:
    image: midnightntwrk/midnight-node:0.22.5
    container_name: midnight-node
    ports:
      - '9944:9944'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9944/health']
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 20s
    environment:
      CFG_PRESET: 'dev'
      SIDECHAIN_BLOCK_BENEFICIARY: '04bcf7ad3be7a5c790460be82a713af570f22e0f801f6659ab8e84a52be6969e'

  indexer:
    image: midnightntwrk/indexer-standalone:4.3.3
    container_name: midnight-indexer
    ports:
      - '8088:8088'
    environment:
      RUST_LOG: 'indexer=info,chain_indexer=info,indexer_api=info,wallet_indexer=info,indexer_common=info,fastrace_opentelemetry=off,info'
      APP__APPLICATION__NETWORK_ID: 'undeployed'
      APP__INFRA__NODE__URL: 'ws://node:9944'
      APP__INFRA__STORAGE__PASSWORD: 'indexer'
      APP__INFRA__PUB_SUB__PASSWORD: 'indexer'
      APP__INFRA__LEDGER_STATE_STORAGE__PASSWORD: 'indexer'
      APP__INFRA__SECRET: '303132333435363738393031323334353637383930313233343536373839303132'
    healthcheck:
      test: ['CMD-SHELL', 'cat /var/run/indexer-standalone/running']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    depends_on:
      node:
        condition: service_healthy

  proof-server:
    image: midnightntwrk/proof-server:8.1.0
    container_name: midnight-proof-server
    command: ['midnight-proof-server -v']
    ports:
      - '6300:6300'
    environment:
      RUST_BACKTRACE: 'full'

  # Indexer app's own business-data Postgres (poap-state.ts / api routes) —
  # unrelated to the Midnight SDK generation, merged in from the old
  # docker-compose.devnet.yml (now removed).
  poap-pg:
    image: postgres:15
    container_name: poap-indexer-pg
    ports:
      - '5434:5432'
    environment:
      POSTGRES_USER: 'poap'
      POSTGRES_PASSWORD: 'poap'
      POSTGRES_DB: 'poap_indexer'
    volumes:
      - poap_indexer_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U poap -d poap_indexer']
      interval: 5s
      retries: 10

volumes:
  poap_indexer_pg_data:
